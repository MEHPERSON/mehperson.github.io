<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEH Chat</title>

    <link rel="stylesheet" href="chat.css">
</head>
<body>

<header>
    MEH Chat
</header>

<div class="container">

    <div class="card" id="loginBox">
        <h2>Join Chat</h2>

        <input
            type="text"
            id="username"
            placeholder="Username">

        <input
            type="text"
            id="userCode"
            placeholder="Your Unique Code">

        <input
            type="text"
            id="inviteCode"
            placeholder="Group Invite Code">

        <button id="joinBtn">
            Join Chat
        </button>
    </div>

    <div class="card" id="chatBox" style="display:none;">

        <h2 id="groupName">Main Chat</h2>

        <div id="messages"></div>

        <input
            id="messageInput"
            placeholder="Type a message...">

        <button id="sendBtn">
            Send
        </button>

    </div>

</div>

<script type="module" src="chat.js"></script>

</body>
</html>
