<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEH Chat</title>

    <link rel="stylesheet" href="chat.css">
</head>


<body>


<header>
    MEH Chat
</header>



<div class="container">


    <!-- Login Card -->
    <div class="card" id="authCard">

        <h2>Welcome</h2>


        <button id="createAccountBtn">
            Create New Account
        </button>


        <br><br>


        <button id="loginBtn">
            Sign In
        </button>

    </div>





    <!-- User Card -->
    <div class="card" id="userCard" style="display:none;">


        <h2 id="welcomeText">
            Welcome
        </h2>



        <p>
            Code:
            <span id="userCodeText"></span>
        </p>



        <p>
            Role:
            <span id="userRoleText"></span>
        </p>




        <button id="createGroupBtn" style="display:none;">
            Create Group
        </button>



        <br><br>



        <button id="logoutBtn">
            Logout
        </button>



    </div>





    <!-- Groups Area -->

    <div class="card" id="groupsCard" style="display:none;">


        <h2>
            Groups
        </h2>


        <div id="groupList">

        </div>


    </div>



</div>



<script type="module" src="chat.js"></script>


</body>
</html>
