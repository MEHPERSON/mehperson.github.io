<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEHPERSON</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="images/logo.svg" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #1c1c1c;
      --text: #d4d4d4;
      --muted: #a3a3a3;
      --accent: #b4e9ff;
      --border: rgba(163, 163, 163, 0.15);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 94%;
      min-height: 100vh;
      margin: 0 auto;
      padding: 72px 40px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    .logo img {
      width: 60px;
      height: 60px;
    }

    .logo h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .divider {
      width: 1px;
      height: 18px;
      background: rgba(163, 163, 163, 0.2);
      margin: 0 12px;
    }

    nav {
      display: flex;
      align-items: center;
      font-size: 1rem;
      font-weight: 500;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    nav a:first-child {
      color: var(--accent);
    }

    nav a:hover {
      color: var(--accent);
    }

    .nav-sep {
      margin: 0 8px;
      color: var(--muted);
      opacity: 0.3;
      font-weight: 300;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.2s, background 0.2s;
    }

    .icon-btn:hover {
      color: var(--accent);
      background: rgba(255, 255, 255, 0.05);
    }

    /* Hero — two column on desktop */
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: start;
      margin-top: 32px;
      margin-bottom: -50px;
    }

    .hero-left {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .hero-left h2 {
      font-size: 3.25rem;
      line-height: 1.15;
      font-weight: 700;
      color: var(--text);
    }

    .hero-left p {
      color: var(--muted);
      line-height: 1.8;
      font-size: 1.2rem;
    }

    .find-me {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 75px;
      margin-top: 16px;
    }

    .find-me > span {
      color: var(--muted);
      font-size: 1.65rem;
      font-weight: 600;
    }

    .social-icons {
      display: flex;
      gap: 36px;
      flex-wrap: wrap;
    }

    .social-icons a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .social-icons a:hover {
      color: var(--accent);
      transform: translateY(-2px);
    }

    .social-icons svg {
      width: 40px;
      height: 40px;
    }

    .social-icons span {
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* Terminal */
    .terminal {
      background: #141414;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      font-size: 0.82rem;
      width: 100%;
      max-width: 560px;
      margin-top: 72px;
    }

    .terminal-bar {
      background: #222;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-r { background: #ff5f57; }
    .dot-y { background: #febc2e; }
    .dot-g { background: #28c840; }

    .terminal-title {
      margin-left: auto;
      margin-right: auto;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .terminal-body {
      padding: 20px 20px 120px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      line-height: 1.7;
      height: 300px;
      overflow-y: auto;
    }

    .terminal-body::-webkit-scrollbar {
      width: 6px;
    }

    .terminal-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .terminal-body::-webkit-scrollbar-thumb {
      background: rgba(180, 233, 255, 0.25);
      border-radius: 999px;
    }

    .terminal-body::-webkit-scrollbar-thumb:hover {
      background: rgba(180, 233, 255, 0.45);
    }

    #terminal-input {
      position: fixed;

      left: 0;
      top: 0;

      width: 1px;
      height: 1px;

      opacity: 0;
      border: none;
      padding: 0;
      margin: 0;

      pointer-events: none;
      z-index: -1;
    }

    .t-line { display: flex; gap: 8px; }
    .t-prompt { color: var(--accent); font-weight: 600; flex-shrink: 0; }
    .t-cmd { color: var(--text); }
    .t-out {color: var(--muted); white-space: pre;}
    .t-out.green { color: #4ade80; }
    .t-out.red {color: #ff6b6b;}
    .t-out.accent { color: var(--accent); }
    .t-blank { height: 6px; }
    .t-line {
    display: flex;
    align-items: center;
    }
    .t-cursor {
    display: inline-block;
    width: 8px;
    height: 1em;
    background: #bfe9ff;
    margin-left: 2px;
    vertical-align: -2px;
    animation: blink 1s steps(1) infinite;
    }
     @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .t-label {
    color: var(--muted);
    }

    .t-value {
    color: var(--text);
    }

    .rgb-ascii {
    white-space: pre;
    font-family: inherit;
    font-size: 0.9rem;
    line-height: 1.15;
    font-weight: 700;

    background: linear-gradient(
        90deg,
        #ff4d4d,
        #ffb84d,
        #ffee4d,
        #4dff88,
        #4dd2ff,
        #7a5cff,
        #ff4dc4,
        #ff4d4d
    );

    background-size: 400% 100%;

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    animation:
        rainbowShift 8s linear infinite,
        breathe 3s ease-in-out infinite;
}

@keyframes rainbowShift {
    from {
        background-position: 0%;
    }
    to {
        background-position: 400%;
    }
}

@keyframes breathe {
    0%,100% {
        transform: scale(1);
        opacity: .85;
    }

    50% {
        transform: scale(1.02);
        opacity: 1;
    }
}


    /* Gaming section */
    section {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-top: 32px;
    }

    .section-title {
      font-size: 3.25rem;
      font-weight: 700;
      line-height: 1.15;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
    }

    .gaming-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px 0;
    }

    .gaming-item {
      display: flex;
      align-items: center;
      gap: 24px;
      cursor: pointer;
      border-left: 2px solid transparent;
      padding: 0 12px;
      transition: border-color 0.2s ease;
    }

    .gaming-item:hover {
      border-left-color: var(--accent);
    }

    .gaming-item:hover .gaming-name {
      color: var(--accent);
    }

    .gaming-platform {
      color: var(--muted);
      font-size: 1rem;
      width: 100px;
      flex-shrink: 0;
    }

    .gaming-name {
      color: var(--text);
      font-size: 1.1rem;
      text-decoration: underline;
      text-decoration-color: rgba(163, 163, 163, 0.3);
      text-underline-offset: 4px;
      text-decoration-thickness: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .gaming-name svg {
      opacity: 0.4;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--accent);
    }

    /* Toast */
    #toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(8px);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Mobile */
    @media (max-width: 768px) {
      .container {
        width: 100%;
        padding: 32px 20px;
        gap: 8px;
      }

      header {
        flex-wrap: nowrap;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .logo {
        gap: 36px;
      }

      .logo img {
        width: 42px;
        height: 42px;
      }

      .logo h1 {
        font-size: 1.4rem;
      }

      .header-right {
        gap: 10px;
      }

      .divider {
        height: 14px;
        margin: 0 6px;
      }

      nav {
        font-size: 0.9rem;
      }

      /* Stack hero to single column on mobile */
      .hero {
        grid-template-columns: 1fr;
        gap: 32px;
        margin-top: 24px;
        margin-bottom: -12px;
      }

      .hero-left h2 {
        font-size: 2.3rem;
      }

      .hero-left p {
        font-size: 1rem;
        line-height: 1.6;
      }

      .find-me {
        gap: 36px;
      }

      /* Terminal shrinks to full width on mobile */
      .terminal {
        font-size: 0.78rem;
        margin-top: 24px;
      }

      .terminal-body {
        padding: 16px;
        min-height: unset;
      }

      .gaming-item {
        gap: 12px;
      }

      .gaming-platform {
        width: 80px;
        font-size: 0.9rem;
      }

      .gaming-name {
        font-size: 1rem;
      }

      section {
        margin-top: 32px;
      }

      footer {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<script>
  // ── Theme ──
  const sunSVG = `
    <circle cx="12" cy="12" r="5"/>
    <line x1="12" y1="1" x2="12" y2="3"/>
    <line x1="12" y1="21" x2="12" y2="23"/>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
    <line x1="1" y1="12" x2="3" y2="12"/>
    <line x1="21" y1="12" x2="23" y2="12"/>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
  `;
  const moonSVG = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;

  let dark = true;

  function applyTheme() {
    const r = document.documentElement;
    if (dark) {
      r.style.setProperty('--bg',     '#1c1c1c');
      r.style.setProperty('--text',   '#d4d4d4');
      r.style.setProperty('--muted',  '#a3a3a3');
      r.style.setProperty('--accent', '#b4e9ff');
      r.style.setProperty('--border', 'rgba(163,163,163,0.15)');
      document.getElementById('theme-icon').innerHTML = sunSVG;
    } else {
      r.style.setProperty('--bg',     '#f5f5f5');
      r.style.setProperty('--text',   '#1c1c1c');
      r.style.setProperty('--muted',  '#555555');
      r.style.setProperty('--accent', '#005580');
      r.style.setProperty('--border', 'rgba(0,0,0,0.12)');
      document.getElementById('theme-icon').innerHTML = moonSVG;
    }
    initParticles();
  }

  function toggleTheme() {
    dark = !dark;
    applyTheme();
  }

  // ── Toast ──
  function copyText(text, msg) {
    navigator.clipboard.writeText(text);
    const toast = document.getElementById('toast');
    toast.innerHTML = `<span style="color:var(--accent)">✓</span><span>${msg}</span>`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // ── Particles ──
  let particles = [], animFrame, canvas, ctx;

  function initParticles() {
    if (animFrame) cancelAnimationFrame(animFrame);
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;';
      document.body.prepend(canvas);
      ctx = canvas.getContext('2d');
      window.addEventListener('resize', resizeCanvas);
    }
    resizeCanvas();
    particles = [];
    const count = Math.floor(window.innerWidth / 12);
    for (let i = 0; i < count; i++) spawnParticle(true);
    loop();
  }

  function resizeCanvas() {
    if (canvas) {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
  }

  function spawnParticle(randomY) {
    const size = Math.random() * 2.5 + 0.5;
    particles.push({
      x: Math.random() * canvas.width,
      y: randomY ? Math.random() * canvas.height : canvas.height + 10,
      size,
      speedX: (Math.random() - 0.5) * 0.4,
      speedY: -(Math.random() * 0.5 + 0.2),
      opacity: Math.random() * 0.5 + 0.1,
      drift: Math.random() * Math.PI * 2,
    });
  }

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const color = dark ? '163,163,163' : '85,85,85';
    particles.forEach((p, i) => {
      p.drift += 0.01;
      p.x += p.speedX + Math.sin(p.drift) * 0.3;
      p.y += p.speedY;
      if (p.y < -10) {
        particles.splice(i, 1);
        spawnParticle(false);
        return;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${color},${p.opacity})`;
      ctx.fill();
    });
    animFrame = requestAnimationFrame(loop);
  }

  // ── Terminal typewriter ──
  const introLines = [
        { type: "cmd", text: "whoami" },
    { type: "out", text: "Mehperson" },

    { type: "blank" },

    { type: "cmd", text: "cat about.txt" },
    { type: "out", text: "User              : MEH" },
    { type: "out", text: "Role              : Student" },
    { type: "out", text: "Favorite Game     : Clair Obscure Expedition 33" },
    { type: "out", text: "                    Minecraft" },
    { type: "out", text: "Location          : Chattogram, BD" },

    { type: "blank" },

    { type: "cmd", text: "ls skills" },
    { type: "out", text: "python", accent: true },
    { type: "out", text: "figma", accent: true },
    { type: "out", text: "html (learning)", accent: true },
    { type: "out", text: "minecraft", accent: true },

    { type: "blank" },

    { type: "cmd", text: "cat now.txt" },
    { type: "out", text: "> Studying for SSC exams", green: true },
    { type: "out", text: "> Learning HTML and Web Development", green: true },
    { type: "out", text: "> Open to collabs", green: true },

    { type: "blank" },

    { type: "cursor" }
  ];

  const termBody = document.getElementById('term-body');
  const terminalInput = document.getElementById("terminal-input");
  let lineIdx = 0, charIdx = 0;

  function typeNext() {
    if (lineIdx >= introLines.length) return;
    const line = introLines[lineIdx];

    if (line.type === 'blank') {
      const el = document.createElement('div');
      el.className = 't-blank';
      termBody.appendChild(el);
      lineIdx++;
      setTimeout(typeNext, 60);
      return;
    }

    if (line.type === 'cursor') {

      const el = document.createElement('div');
      el.className = 't-line';

      el.innerHTML = `
        <span class="t-prompt">$</span>
        <span class="t-cmd"></span>
        <span class="t-cursor"></span>
      `;

      termBody.appendChild(el);

      currentCmd = el.querySelector(".t-cmd");

      terminalReady = true;
      
      resetIdleTimer();

      requestAnimationFrame(() => {
    if ("ontouchstart" in window) {
        terminalInput.focus({ preventScroll: true });
    } else {
        termBody.focus({ preventScroll: true });
    }
      });

      return;
    }

    if (line.type === 'out') {
      const el = document.createElement('div');
      el.className = 't-line';
      const out = document.createElement('span');
      out.className = 't-out' + (line.accent ? ' accent' : '') + (line.green ? ' green' : '');
      out.textContent = line.text;
      el.appendChild(out);
      termBody.appendChild(el);
      lineIdx++;
      setTimeout(typeNext, 40);
      return;
    }

    if (line.type === 'cmd') {
      if (charIdx === 0) {
        const el = document.createElement('div');
        el.className = 't-line';
        el.dataset.idx = lineIdx;
        el.innerHTML = `<span class="t-prompt">$</span><span class="t-cmd"></span>`;
        termBody.appendChild(el);
      }
      const el = termBody.querySelector(`[data-idx="${lineIdx}"] .t-cmd`);
      if (charIdx < line.text.length) {
        el.textContent = line.text.slice(0, charIdx + 1);
        charIdx++;
        setTimeout(typeNext, 55);
      } else {
        charIdx = 0;
        lineIdx++;
        setTimeout(typeNext, 180);
      }
    }
  }

let history = [];
let historyIndex = -1;
let terminalReady = false;
let currentInput = "";
let currentCmd = null;
let idleTimer;
const IDLE_TIMEOUT = 15000; // 15 seconds

function handleKey(e) {

    if (!terminalReady) return;

    resetIdleTimer();
    termBody.addEventListener("mousemove", resetIdleTimer);
    termBody.addEventListener("click", resetIdleTimer); 

    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        currentInput += e.key;
        currentCmd.textContent = currentInput;
    }

    if (e.key === "Backspace") {
      e.preventDefault();
      currentInput = currentInput.slice(0, -1);
      currentCmd.textContent = currentInput;
    }

    if (e.key === "Enter") {
    e.preventDefault();

    const cmd = currentInput.trim();

    if (cmd !== "") {
        history.push(cmd);
        historyIndex = history.length;
    }

    executeCommand(cmd);
    }

    if (e.key === "ArrowUp") {

    e.preventDefault();

    if (historyIndex > 0) {
        historyIndex--;
        currentInput = history[historyIndex];
        currentCmd.textContent = currentInput;
    }

}

    if (e.key === "ArrowDown") {

        e.preventDefault();

    if (historyIndex < history.length - 1) {
         historyIndex++;
         currentInput = history[historyIndex];
     } else {
        historyIndex = history.length;
       currentInput = "";
       }

     currentCmd.textContent = currentInput;

}
    if (e.key === "Tab") {

    e.preventDefault();

    const commands = [
        "help",
        "whoami",
        "skills",
        "ls skills/",
        "now",
        "cat about.txt",
        "cat now.txt",
        "cat now.txt",
        "cat contact.txt",
        "MEH",
        "clear"
    ];

    const match = commands.find(c =>
        c.toLowerCase().startsWith(currentInput.toLowerCase())
    );

    if (match) {
        currentInput = match;
        currentCmd.textContent = currentInput;
    }

}


}

termBody.addEventListener("focus", () => clearTimeout(idleTimer));
terminalInput.addEventListener("focus", () => clearTimeout(idleTimer));

termBody.addEventListener("blur", resetIdleTimer);
terminalInput.addEventListener("blur", resetIdleTimer);

termBody.addEventListener("keydown", handleKey);

terminalInput.addEventListener("keydown", (e) => {

    handleKey(e);

    requestAnimationFrame(() => {
        terminalInput.value = currentInput;
    });

});

function executeCommand(cmd) {

    // Remove old cursor
    const cursor = document.querySelector(".t-cursor");
    if (cursor) cursor.remove();

    switch (cmd.toLowerCase()) {

    case "help":

        printOutput("Available commands");
        printOutput("──────────────────");
        printOutput("help");
        printOutput("whoami");
        printCommand("cat about.txt");
        printOutput("skills");
        printCommand("ls skills/");
        printOutput("now");
        printCommand("cat now.txt");
        printOutput('Try "ls" to explore.');
        printOutput("clear");
        break;

    case "whoami":

        printOutput("Mehperson");

        break;
    case "cat about.txt":

    printOutput("User              : MEH");
    printOutput("Role              : Student");
    printOutput("Favorite Games    : Clair Obscure: Expedition 33");
    printOutput("                   Minecraft");
    printOutput("Location          : Chattogram, BD");

        break;

    case "skills":
    case "ls skills":
    case "ls skills/":

        printOutput("python", "accent");
        printOutput("figma", "accent");
        printOutput("html (learning)", "accent");
        printOutput("minecraft", "accent");

        break;

    case "now":
    case "cat now.txt":

        printOutput("> Studying for SSC exams", "green");
        printOutput("> Learning HTML and Web Development", "green");
        printOutput("> Open to collabs", "green");

        break;
    case "ls":

    printTree("├── about.txt");
    printTree("├── now.txt");
    printTree("├── contact.txt");
    printTree("└── skills/");

        break;
    case "cat contact.txt":

    printOutput("GitHub  : github.com/mehperson");
    printOutput("x       : x.com/MEHPERSON69");
    printOutput("Email   : M3HPERSON@gmail.com");

        break;
  
    
    case "clear":

    termBody.innerHTML = "";
    newPrompt();
    return;

    default:

        printOutput("Command not found.", "red");
        printOutput('Type "help" for available commands.');
      }

function printOutput(text, color = "") {


    const line = document.createElement("div");
    line.className = "t-line";

    const span = document.createElement("span");
    span.className = "t-out";

    if (color)
        span.classList.add(color);

    span.textContent = text;

    line.appendChild(span);

    termBody.appendChild(line);

}

function printAscii(text) {

    const line = document.createElement("div");

    line.className = "rgb-ascii";

    line.textContent = text;

    termBody.appendChild(line);

}

function printDirectory(text) {

    const line = document.createElement("div");
    line.className = "t-line";

    const span = document.createElement("span");
    span.className = "t-out accent";

    span.textContent = text;

    line.appendChild(span);

    termBody.appendChild(line);

}

function printTree(text, isDirectory = false) {

    const line = document.createElement("div");
    line.className = "t-line";

    const span = document.createElement("span");
    span.className = isDirectory
        ? "t-out accent"
        : "t-out";

    span.textContent = text;

    line.appendChild(span);
    termBody.appendChild(line);
}

function printCommand(text) {

    const line = document.createElement("div");
    line.className = "t-line";

    const span = document.createElement("span");
    span.className = "t-out accent";

    span.textContent = text;

    line.appendChild(span);

    termBody.appendChild(line);

}

function newPrompt() {

    const line = document.createElement("div");

    line.className = "t-line";

    line.innerHTML = `
        <span class="t-prompt">$</span>
        <span class="t-cmd"></span>
        <span class="t-cursor"></span>
    `;

    termBody.appendChild(line);

    currentCmd = line.querySelector(".t-cmd");
    currentInput = "";
    
    if (!("ontouchstart" in window)) {
    requestAnimationFrame(() => {
    termBody.scrollTo({
        top: termBody.scrollHeight,
        behavior: "smooth"
    });
});
}

}
function resetIdleTimer() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(resetTerminal, IDLE_TIMEOUT);
}

function resetTerminal() {

    terminalReady = false;

    termBody.innerHTML = "";

    lineIdx = 0;
    charIdx = 0;

    currentInput = "";

    typeNext();
}

termBody.addEventListener("click", () => {

    if ("ontouchstart" in window) {
        terminalInput.focus({ preventScroll: true });
    } else {
        termBody.focus({ preventScroll: true });
    }

});

terminalInput.addEventListener("input", () => {

    currentInput = terminalInput.value;
    currentCmd.textContent = currentInput;

});

function resetIdleTimer() {

    clearTimeout(idleTimer);

    if (document.activeElement === termBody ||
        document.activeElement === terminalInput) {
        return;
    }

    idleTimer = setTimeout(resetTerminal, IDLE_TIMEOUT);
}



  applyTheme();
  setTimeout(typeNext, 400);
</script>
